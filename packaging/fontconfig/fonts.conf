<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Minimal fontconfig configuration for the packaged Windows build.

  WeasyPrint -> Pango -> fontconfig must not look for a configuration at the
  build machine's MSYS2/GTK install prefix, which does not exist on the
  customer's PC. desktop/main.py points FONTCONFIG_FILE / FONTCONFIG_PATH at
  this file when running from the PyInstaller bundle.

  WINDOWSFONTDIR and LOCAL_APPDATA_FONTCONFIG_CACHE are special values that
  fontconfig's Windows build expands itself (C:\Windows\Fonts and the
  per-user cache folder). The Vazirmatn web fonts used by print.css are
  loaded through @font-face by WeasyPrint and do not need to be listed here.
-->
<fontconfig>
  <dir>WINDOWSFONTDIR</dir>
  <cachedir>LOCAL_APPDATA_FONTCONFIG_CACHE</cachedir>
</fontconfig>
