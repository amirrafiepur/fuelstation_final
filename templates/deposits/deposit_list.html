{% extends "base.html" %}
{% block title %}واریزی‌ها{% endblock %}
{% block content %}

<div class="panel">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
    <h2 class="panel__title" style="margin:0;">واریزی‌ها</h2>
    <a href="{% url 'deposits:deposit_create' %}" class="btn" style="display:inline-block; width:auto; padding:0.4rem 0.9rem; font-size:0.85rem;">
      ثبت اطلاعات جدید
    </a>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
    <div>
      <label class="form-label">سال</label>
      <input type="number" class="form-input numeric" value="{{ year }}"
             onchange="window.location = '?year=' + this.value + '&month={{ month }}'">
    </div>
    <div>
      <label class="form-label">ماه</label>
      <select class="form-input" onchange="window.location = '?year={{ year }}&month=' + this.value">
        <option value="1" {% if month == 1 %}selected{% endif %}>۱</option>
        <option value="2" {% if month == 2 %}selected{% endif %}>۲</option>
        <option value="3" {% if month == 3 %}selected{% endif %}>۳</option>
        <option value="4" {% if month == 4 %}selected{% endif %}>۴</option>
        <option value="5" {% if month == 5 %}selected{% endif %}>۵</option>
        <option value="6" {% if month == 6 %}selected{% endif %}>۶</option>
        <option value="7" {% if month == 7 %}selected{% endif %}>۷</option>
        <option value="8" {% if month == 8 %}selected{% endif %}>۸</option>
        <option value="9" {% if month == 9 %}selected{% endif %}>۹</option>
        <option value="10" {% if month == 10 %}selected{% endif %}>۱۰</option>
        <option value="11" {% if month == 11 %}selected{% endif %}>۱۱</option>
        <option value="12" {% if month == 12 %}selected{% endif %}>۱۲</option>
      </select>
    </div>
  </div>

  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
    <span style="font-weight:600;">جمع مبلغ واریزی ماه</span>
    <span class="numeric" style="font-weight:600;">{{ monthly_total }}</span>
  </div>

  <table style="width:100%; border-collapse: collapse; font-size: 0.9rem;">
    <thead>
      <tr style="border-bottom: 2px solid var(--color-border); text-align: right;">
        <th style="padding: 0.4rem;">دهه</th>
        <th style="padding: 0.4rem;">جمع مبلغ واریزی</th>
        <th style="padding: 0.4rem;"></th>
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr style="border-bottom: 1px solid var(--color-border); cursor: pointer;"
          onclick="window.location='{% url 'deposits:deposit_decade_detail' year month row.decade %}'">
        <td style="padding: 0.6rem;">{{ row.label }}</td>
        <td style="padding: 0.6rem;" class="numeric">{{ row.total }}</td>
        <td style="padding: 0.6rem;">
          <a href="{% url 'printing:deposit_decade_print' %}?year={{ year }}&month={{ month }}&decade={{ row.decade }}"
             target="_blank" onclick="event.stopPropagation()"
             style="font-size:0.8rem;">
            چاپ / PDF
          </a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
