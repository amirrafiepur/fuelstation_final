<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}گزارش{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>
  <div class="print-header">
    <div>
      <p class="print-header__station-name">{{ station.name }}</p>
      <p class="print-header__station-location">{{ station.province }}، {{ station.city }}</p>
    </div>
    <div>
      <div class="print-header__report-title">{% block report_title %}{% endblock %}</div>
      <div class="print-header__report-period">{% block report_period %}{% endblock %}</div>
    </div>
  </div>

  {% block report_body %}{% endblock %}

  <p class="print-footer-note">
    این گزارش به‌صورت خودکار از سامانه حسابداری جایگاه تولید شده است.
  </p>
</body>
</html>
