{% extends "base.html" %}
{% block title %}ورود فروش دیجیتال{% endblock %}
{% block content %}

<div class="panel" style="max-width: 480px;">
  <h2 class="panel__title">فروش دیجیتال — {{ entry.tank.product.name }}</h2>
  <p style="color: var(--color-ink-muted); font-size:0.85rem;">
    {{ entry.year }}/{{ entry.month }}
  </p>

  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div style="margin-bottom: 1rem;">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
    </div>
    {% endfor %}
    <button type="submit" class="btn">ثبت</button>
    <a href="{% url 'comparison:comparison' %}?year={{ entry.year }}&month={{ entry.month }}"
       class="btn" style="background: var(--color-surface-alt, #eee); color: inherit; display:inline-block; text-align:center;">
      انصراف
    </a>
  </form>
</div>
{% endblock %}
